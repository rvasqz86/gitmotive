# Deploys site/ to Cloudflare Pages. Inert until the repo secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID exist; see launch/DEPLOY.md for the one-time setup.
name: deploy-site

on:
  push:
    branches: [main]
    paths: ['site/**', 'gitmotive/**', 'scripts/gen_docs.py', 'scripts/docs_src/**']
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_dispatch can be started from any branch; only main may publish production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check generated docs are in sync
        run: python3 scripts/gen_docs.py --check

      - name: Site tests
        run: for f in tests/test_site*.py tests/test_docs_sync.py tests/test_viewer.py; do python3 "$f" || exit 1; done

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=gitmotive --branch=main
