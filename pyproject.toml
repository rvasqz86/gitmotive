[project]
name = "gitwhy"
version = "0.1.0"
description = "git blame for intent: link every line to the prompt and reasoning that produced it"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Raul Vasquez", email = "rvasqz86@gmail.com"}]
readme = "README.md"
keywords = ["git", "blame", "provenance", "ai", "claude-code", "copilot", "cursor"]

[project.urls]
Homepage = "https://github.com/rvasqz86/gitwhy"
dependencies = []

[project.scripts]
gitwhy = "gitwhy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
