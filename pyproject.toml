[project]
name = "gitmotive"
version = "0.1.0"
description = "git blame tells you who. git motive tells you why. Links AI-written lines to the prompt and reasoning that produced them."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Raul Vasquez", email = "rvasqz86@gmail.com"}]
readme = "README.md"
keywords = ["git", "blame", "provenance", "ai", "claude-code", "copilot", "cursor"]

dependencies = []

[project.urls]
Homepage = "https://github.com/rvasqz86/gitmotive"

[project.scripts]
gitmotive = "gitmotive.cli:main"
git-motive = "gitmotive.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
